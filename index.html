<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JKBOSE 12th Question Bank — All Subjects 2020-2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1a17;
    --panel: #1a2e28;
    --panel-2: #1f3a32;
    --rule: #2d4d3f;
    --chalk: #ede8d6;
    --chalk-dim: #a0b8aa;
    --yellow: #e8c547;
    --coral: #e3806b;
    --mint: #79c29a;
    --blue: #8fb8de;
    --pink: #d4a0b0;
    --radius: 10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% 0%, #1a2e28 0%, var(--bg) 60%);
    color:var(--chalk);
    font-family:'Source Sans 3', sans-serif;
    line-height:1.5;
    min-height:100vh;
    padding-bottom:60px;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px 14px 0;}

  .app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .app-header h1{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:2.6rem;
    color:var(--yellow);
    line-height:1;
    display:flex;align-items:center;gap:8px;
  }
  .app-header h1 span{font-size:1.2rem;color:var(--chalk-dim);font-family:'Source Sans 3',sans-serif;font-weight:400;}
  .app-header .stats{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--chalk-dim);text-align:right;}
  .app-header .stats strong{color:var(--chalk);}

  .subject-tabs{
    display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--rule);padding-bottom:8px;flex-wrap:wrap;
  }
  .subject-tab{
    background:none;border:none;color:var(--chalk-dim);
    font-family:'Source Sans 3',sans-serif;font-size:1rem;font-weight:600;
    padding:6px 18px;border-radius:var(--radius) var(--radius) 0 0;
    cursor:pointer;transition:all .15s ease;border-bottom:3px solid transparent;
    display:flex;align-items:center;gap:6px;
  }
  .subject-tab:hover{color:var(--chalk);}
  .subject-tab.active{color:var(--yellow);border-bottom-color:var(--yellow);background:rgba(232,197,71,0.06);}
  .subject-tab .badge{
    font-size:0.6rem;background:var(--panel-2);padding:1px 8px;border-radius:999px;
    color:var(--chalk-dim);
  }
  .subject-tab.active .badge{background:rgba(232,197,71,0.2);color:var(--yellow);}
  .subject-tab .icon{font-size:1.2rem;}

  .controls{
    background:rgba(15,26,24,0.96);
    backdrop-filter:blur(6px);
    padding:10px 0 12px;
    border-bottom:1px solid var(--rule);
    margin-bottom:16px;
    position:sticky;top:0;z-index:10;
  }
  .controls-inner{max-width:1100px;margin:0 auto;padding:0 14px;}
  .rowlabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--chalk-dim);margin:0 0 4px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
  .chip{
    appearance:none;border:1px solid var(--rule);background:var(--panel);
    color:var(--chalk-dim);padding:4px 10px;border-radius:999px;
    font-size:0.75rem;font-family:'Source Sans 3',sans-serif;font-weight:600;
    cursor:pointer;transition:all .15s ease;
  }
  .chip .n{font-family:'IBM Plex Mono',monospace;font-weight:500;opacity:.7;margin-left:3px;}
  .chip.active{background:var(--yellow);border-color:var(--yellow);color:#0d1a17;}
  .chip.off{opacity:.4;}
  .chip.type.active{background:var(--blue);border-color:var(--blue);color:#0d1a17;}

  .controls-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .quickbtns{display:flex;gap:4px;flex-wrap:wrap;}
  .quickbtns button{
    background:none;border:none;color:var(--mint);font-size:0.7rem;
    font-family:'IBM Plex Mono',monospace;cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;padding:2px 4px;
  }
  .score{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--chalk-dim);text-align:right;}
  .score b{color:var(--yellow);}
  .score .correct-n{color:var(--mint);}
  .score .rev-n{color:var(--blue);}

  .topic-section{margin-bottom:20px;}
  .topic-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px;}
  .topic-head h2{font-size:1rem;margin:0;color:var(--chalk);font-weight:700;}
  .topic-head .count{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--chalk-dim);}

  .q-card{
    background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);
    padding:10px 12px 8px;margin-bottom:6px;
  }
  .q-card:hover{border-color:var(--chalk-dim);}
  .q-meta{display:flex;justify-content:space-between;gap:6px;margin-bottom:4px;align-items:center;flex-wrap:wrap;}
  .q-tag{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--mint);}
  .q-kind{font-family:'IBM Plex Mono',monospace;font-size:0.55rem;color:var(--blue);border:1px solid var(--blue);border-radius:3px;padding:0 5px;}
  .q-text{font-size:0.88rem;font-weight:600;margin:0 0 6px;color:var(--chalk);white-space:pre-line;}

  .options{display:grid;gap:4px;}
  .opt{
    display:flex;align-items:flex-start;gap:6px;padding:4px 8px;border-radius:5px;
    border:1px solid var(--rule);background:var(--panel-2);cursor:pointer;font-size:0.8rem;
    transition:all .12s ease;
  }
  .opt:hover{border-color:var(--chalk-dim);}
  .opt .letter{font-family:'IBM Plex Mono',monospace;color:var(--chalk-dim);flex:0 0 auto;font-weight:600;}
  .opt.picked{border-color:var(--yellow);}
  .opt.correct{border-color:var(--mint);background:rgba(121,194,154,0.12);}
  .opt.correct .letter{color:var(--mint);}
  .opt.wrong{border-color:var(--coral);background:rgba(227,128,107,0.12);}
  .opt.wrong .letter{color:var(--coral);}
  .opt.disabled{cursor:default;}

  .verdict{margin-top:4px;font-size:0.75rem;font-family:'IBM Plex Mono',monospace;}
  .verdict.right{color:var(--mint);}
  .verdict.wrong{color:var(--coral);}

  .revealBtn{
    background:var(--panel-2);border:1px solid var(--rule);color:var(--blue);
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 10px;
    border-radius:4px;cursor:pointer;margin-top:2px;
  }
  .revealBtn:hover{border-color:var(--blue);}
  .keypoints{
    margin-top:4px;padding:6px 10px;border-radius:4px;
    background:rgba(143,184,222,0.05);border:1px solid var(--rule);
    font-size:0.8rem;color:var(--chalk-dim);display:none;
  }
  .keypoints.shown{display:block;}
  .keypoints b{color:var(--blue);}
  .reviewRow{display:flex;align-items:center;gap:4px;margin-top:6px;}
  .reviewRow label{font-size:0.7rem;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .reviewRow input{accent-color:var(--mint);width:13px;height:13px;cursor:pointer;}

  .empty-state{color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;font-size:0.8rem;padding:30px 0;text-align:center;}
  footer{max-width:1100px;margin:12px auto 0;padding:0 14px;color:var(--chalk-dim);font-size:0.6rem;font-family:'IBM Plex Mono',monospace;border-top:1px solid var(--rule);padding-top:12px;}

  @media (max-width:700px){
    .app{padding:10px 8px 0;}
    .app-header h1{font-size:2rem;}
    .app-header h1 span{font-size:0.9rem;}
    .chip{font-size:0.65rem;padding:3px 8px;}
    .q-text{font-size:0.82rem;}
    .subject-tab{font-size:0.85rem;padding:4px 12px;}
  }
  @media (max-width:480px){
    .controls-row{flex-direction:column;align-items:stretch;}
    .score{text-align:left;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="app-header">
    <h1>📚 JKBOSE 12th <span>Question Bank · 2020-2025</span></h1>
    <div class="stats">
      <span id="totalStats">Loading...</span>
    </div>
  </header>

  <nav class="subject-tabs" id="subjectTabs">
    <button class="subject-tab active" data-subject="physics">
      <span class="icon">⚛️</span> Physics <span class="badge" id="physCount">0</span>
    </button>
    <button class="subject-tab" data-subject="chemistry">
      <span class="icon">🧪</span> Chemistry <span class="badge" id="chemCount">0</span>
    </button>
    <button class="subject-tab" data-subject="mathematics">
      <span class="icon">📐</span> Mathematics <span class="badge" id="mathCount">0</span>
    </button>
  </nav>

  <div class="controls">
    <div class="controls-inner">
      <p class="rowlabel">Topics</p>
      <div class="chips" id="chips"></div>
      <p class="rowlabel">Question type</p>
      <div class="chips" id="typeChips"></div>
      <div class="controls-row">
        <div class="quickbtns">
          <button id="allBtn">show all</button>
          <button id="noneBtn">hide all</button>
          <button id="resetBtn">reset progress</button>
        </div>
        <div class="score" id="score"></div>
      </div>
    </div>
  </div>

  <main id="quiz"></main>

  <footer>All questions from JKBOSE Class 12 previous year papers (2020-2025). Answers and hints based on standard NCERT concepts.</footer>
</div>

<script>
/* ============================================================
   DATA — ALL SUBJECTS (Physics, Chemistry, Mathematics)
   ============================================================ */

let _id = 0;
const nid = () => 'q' + (_id++);

function mcq(subject, topic, src, text, options, correct) {
  return { id: nid(), subject, topic, src, qtype: 'mcq', text, options, correct };
}
function tf(subject, topic, src, text, correct) {
  return { id: nid(), subject, topic, src, qtype: 'mcq', text, options: { A: "True", B: "False" }, correct };
}
function written(subject, topic, src, text, keypoints) {
  return { id: nid(), subject, topic, src, qtype: 'written', text, keypoints };
}

/* ============================================================
   PHYSICS — COMPLETE (including all from Claude's site)
   ============================================================ */
const PHYSICS_TOPICS = ["Electrostatics","Current Electricity","Magnetism","EMI & AC","EM Waves","Optics","Dual Nature","Atoms & Nuclei","Semiconductors","Communication Systems"];

const PHYSICS_QUESTIONS = [
  // ===== ELECTROSTATICS =====
  mcq("physics","Electrostatics","1108-X · 2024","A body can be negatively charged by:",
    {A:"Giving excess of electrons", B:"Removing some electrons", C:"Giving some protons", D:"Removing some neutrons"}, "A"),
  mcq("physics","Electrostatics","1108-X · 2024","It is possible to have a positively charged body at:",
    {A:"Zero potential", B:"Negative potential", C:"Positive potential", D:"All of these"}, "D"),
  mcq("physics","Electrostatics","1108-Y · 2024","Dimensions of K = 1/(4πε₀):",
    {A:"C²N⁻¹m⁻²", B:"Nm²C⁻²", C:"Nm²C²", D:"Unitless"}, "B"),
  mcq("physics","Electrostatics","1108-Y · 2024","Angle between dipole moment and electric field on equatorial line:",
    {A:"0°", B:"90°", C:"180°", D:"None"}, "C"),
  mcq("physics","Electrostatics","1108-Z · 2024","A stationary charge produces:",
    {A:"An electric field", B:"A magnetic field", C:"Both", D:"An EM wave"}, "A"),
  mcq("physics","Electrostatics","1108-Z · 2024","A soap bubble given negative charge: radius:",
    {A:"Decreases", B:"Increases", C:"Remains same", D:"Cannot predict"}, "B"),
  tf("physics","Electrostatics","6001-A · 2022","Charge resides only on the outer surface of a charged conductor.", "A"),
  mcq("physics","Electrostatics","308-X · 2024-25","In insulators, as temperature decreases, resistivity:",
    {A:"Increases", B:"Decreases", C:"Remains constant", D:"Becomes zero"}, "A"),

  written("physics","Electrostatics","1108-X/Y/Z · 2024","What is an equipotential surface? Give direction of electric field.",
    "A surface on which potential is constant everywhere. The electric field is always perpendicular to an equipotential surface, pointing from higher to lower potential."),
  written("physics","Electrostatics","1108-Y/Z · 2024","No two equipotential surfaces intersect each other. Why?",
    "If they did, the point of intersection would have two different potentials and two field directions at once — impossible, since V and E must be single-valued at any point."),
  written("physics","Electrostatics","1108-Z · 2024","Distinguish between electric potential and potential energy; state the relation.",
    "Potential V = work done per unit positive test charge (scalar, volts). Potential energy U = work done in bringing the actual charge q from infinity to that point. Relation: U = qV."),
  written("physics","Electrostatics","1108-X/Y/Z · 2024","State Gauss's law. Derive E due to infinitely long charged wire. OR Capacitor series/parallel.",
    "Gauss's law: ∮E·dA = q/ε₀. For line charge: E = λ/(2πε₀r). Series: 1/C=1/C₁+1/C₂+1/C₃. Parallel: C=C₁+C₂+C₃."),
  written("physics","Electrostatics","9121-X/Y · 2023","Find expression for E due to line charge using Gauss's theorem. OR Explain conservation of charge.",
    "E = λ/(2πε₀r). Charge conservation: total charge in isolated system stays constant."),
  written("physics","Electrostatics","9121-X · 2023","Find E at any point outside a uniformly charged thin spherical shell. OR Quantization of charge.",
    "For r > R: E = q/(4πε₀r²) — behaves like a point charge. Quantisation: q = ne."),
  written("physics","Electrostatics","9614-A · 2023","Explain superposition principle. OR Energy stored in capacitor.",
    "Superposition: net force is vector sum of individual forces. U = ½CV² = ½QV = Q²/2C."),
  written("physics","Electrostatics","9801-B/C · 2023","What is electric dipole and dipole moment? Derive electric potential. OR Define capacitance; prove U=½CV².",
    "p = q(2a). General: V = kp cosθ/r². Axial: V = kp/r². Equatorial: V = 0."),
  written("physics","Electrostatics","9801-B · 2023","Define electric potential energy. Derive PE of two point charges. OR Van de Graaff generator.",
    "U = kq₁q₂/r₁₂. Van de Graaff: charge sprayed onto belt, carried to dome, potential builds to millions of volts."),
  written("physics","Electrostatics","9801-C · 2023","Define capacitance with dielectric slab. OR Dipole moment; equatorial field.",
    "C = Kε₀A/d. Dipole moment is vector. Equatorial field: E = kp/r³, antiparallel to p."),
  written("physics","Electrostatics","6001-A · 2022","Find electrostatic PE of dipole with q=3×10⁻⁶C, separation 2×10⁻⁷m. OR Three capacitors in series.",
    "U = kq²/r ≈ 4.05×10⁵ J. Series: C = 6/11 ≈ 0.545 μF."),
  written("physics","Electrostatics","6001-A · 2022","State Gauss' law. Derive E due to infinite line charge. OR Van de Graaff generator.",
    "Same line-charge derivation."),
  written("physics","Electrostatics","308-X · 2024-25","Draw lines of force for two equal and similar charges (q₁=q₂<0 and q₁=q₂>0).",
    "Field lines run radially from/into each charge and repel, leaving a null point midway. Lines point inward for negative charges, outward for positive."),
  written("physics","Electrostatics","308-X · 2024-25","Electron separated from proton by 0.53 Å. Calculate electric field at electron.",
    "E = kq/r² = 9×10⁹ × 1.6×10⁻¹⁹ / (0.53×10⁻¹⁰)² ≈ 5.13×10¹¹ N/C."),
  written("physics","Electrostatics","308-X · 2024-25","Using Gauss' theorem derive E due to infinitely long wire. OR Electric potential from +Q.",
    "Same line-charge derivation. V = kQ/r."),

  // ===== CURRENT ELECTRICITY =====
  mcq("physics","Current Electricity","1108-X · 2024","Which relation is called current density?",
    {A:"I/A", B:"A/I", C:"I²/A", D:"I³/A²"}, "A"),
  mcq("physics","Current Electricity","1108-Y · 2024","Ohm's law is not obeyed by:",
    {A:"Electrolytes", B:"Discharge tubes", C:"Vacuum tubes", D:"All of these"}, "D"),
  mcq("physics","Current Electricity","1108-Z · 2024","The reciprocal of resistance is:",
    {A:"Conductance", B:"Specific resistance", C:"Voltage", D:"Current"}, "A"),
  mcq("physics","Current Electricity","308-X · 2024-25","In insulators as temperature decreases, resistivity:",
    {A:"Increases", B:"Decreases", C:"Remains constant", D:"Becomes zero"}, "A"),
  mcq("physics","Current Electricity","1105-A · 2020","Ratio of drift velocity to thermal velocity is of order:",
    {A:"10⁻⁸", B:"10⁻⁵", C:"10⁻¹⁰", D:"10⁻³"}, "A"),

  written("physics","Current Electricity","1108-X · 2024","Derive relation between e.m.f., potential difference, and internal resistance.",
    "ε = V + Ir (discharging), so V = ε − Ir."),
  written("physics","Current Electricity","1108-X/Y/Z · 2024","10 C charge flows through wire in 5 min. Radius 1 mm, n=5×10²²/cm³. Calculate current and drift velocity.",
    "I = Q/t = 10/300 ≈ 0.033 A. vd = I/(nAe) ≈ 1.33×10⁻⁶ m/s."),
  written("physics","Current Electricity","1108-X/Y/Z · 2024","What is an ammeter? Convert galvanometer to ammeter.",
    "An ammeter measures current, connected in series. Convert by connecting low-resistance shunt in parallel."),
  written("physics","Current Electricity","1108-Y · 2024","Define resistivity and SI unit. Explain variation with temperature.",
    "ρ = RA/L, unit Ω·m. For conductors, ρ increases with temperature."),
  written("physics","Current Electricity","1108-Z · 2024 / 9121 · 2023","Using Kirchhoff's laws, derive condition for balance of Wheatstone bridge.",
    "At balance: P/Q = R/S."),
  written("physics","Current Electricity","9121 · 2023","Explain how to compare e.m.f.'s of two cells using potentiometer.",
    "Balance for each cell: ε₁/ε₂ = l₁/l₂."),
  written("physics","Current Electricity","9121 · 2023","Derive expression for drift velocity in terms of relaxation time. OR Metre bridge.",
    "vd = eEτ/m. Metre bridge: R = [(100−l)/l] × known resistance."),
  written("physics","Current Electricity","9121 · 2023","Wire resistance 10.5Ω at 21°C and 16.4Ω at 147°C. Find temperature coefficient.",
    "α = (R₂−R₁)/(R₁×ΔT) = (16.4−10.5)/(10.5×126) ≈ 4.46×10⁻³ per °C."),
  written("physics","Current Electricity","9801-B/C · 2023","125 cm balances Daniel cell; 100 cm when 2Ω joined. Find internal resistance.",
    "r = R(l₁−l₂)/l₂ = 2×(125−100)/100 = 0.5 Ω."),
  written("physics","Current Electricity","9801-B/C · 2023","Galvanometer 50Ω, 2mA full-scale. Convert to voltmeter (0-5V) and ammeter (0-5A).",
    "Voltmeter: R = 2450Ω. Ammeter: S ≈ 0.02Ω."),
  written("physics","Current Electricity","9614-A · 2023","Two moving-coil galvanometers — ratio of current and voltage sensitivity.",
    "Current sensitivity ∝ NAB/k. Voltage sensitivity ∝ NAB/(kR)."),
  written("physics","Current Electricity","9614-A · 2023","Battery emf 10V, internal 3Ω, current 0.5A. Find resistor and terminal voltage.",
    "R = 17Ω. Terminal voltage V = 8.5V."),
  written("physics","Current Electricity","9614-A · 2023","Variation of resistance with temperature. Define temperature coefficient.",
    "R = R₀(1+αΔT); α = fractional change in resistance per degree."),
  written("physics","Current Electricity","9801-C · 2023","Discuss situations describing failure of Ohm's law.",
    "Non-ohmic devices: electrolytes, discharge tubes, diodes, transistors — V-I graph not linear."),
  written("physics","Current Electricity","308-X · 2024-25","State two factors on which sensitivity of moving coil galvanometer depends.",
    "Sensitivity ∝ NAB/k — depends on N, A, B, and k."),
  written("physics","Current Electricity","308-X · 2024-25","Calculate number of electrons per second through 100W lamp at 200V.",
    "I = P/V = 0.5A. n = I/e = 0.5/1.6×10⁻¹⁹ ≈ 3.13×10¹⁸ electrons/second."),
  written("physics","Current Electricity","308-X · 2024-25","Using Kirchhoff's laws derive Wheatstone bridge condition. OR Define drift velocity.",
    "P/Q = R/S. I = nAevd, so vd = I/(nAe)."),

  // ===== MAGNETISM =====
  mcq("physics","Magnetism","1108-X · 2024","Which is ferromagnetic?",
    {A:"Aluminium", B:"Quartz", C:"Nickel", D:"Bismuth"}, "C"),
  mcq("physics","Magnetism","1108-Y · 2024","Which is paramagnetic?",
    {A:"Antimony", B:"Silver", C:"Marble", D:"Aluminium"}, "D"),
  mcq("physics","Magnetism","1108-Z · 2024","Susceptibility is positive and small for:",
    {A:"Paramagnetic", B:"Ferromagnetic", C:"Diamagnetic", D:"Non-magnetic"}, "A"),
  mcq("physics","Magnetism","308-X · 2024-25","No force on current-carrying conductor when angle with B is:",
    {A:"0°", B:"45°", C:"90°", D:"135°"}, "A"),
  mcq("physics","Magnetism","308-X · 2024-25","Torque on magnet is maximum when θ =",
    {A:"0°", B:"180°", C:"360°", D:"90°"}, "D"),
  mcq("physics","Magnetism","308-X · 2024-25","SI unit of magnetic flux is:",
    {A:"Weber", B:"Gauss", C:"Oersted", D:"Tesla"}, "A"),
  mcq("physics","Magnetism","1105-A · 2020","Magnetic field inside solenoid is:",
    {A:"Directly proportional to length", B:"Directly proportional to current", C:"Inversely proportional to turns", D:"Inversely proportional to current"}, "B"),

  written("physics","Magnetism","1108 · 2024","What are magnetic lines of force? Why don't two such lines cross?",
    "Field lines never cross because B has one unique direction at any given point."),
  written("physics","Magnetism","9121 · 2023","State and explain Fleming's right-hand rule.",
    "Thumb = velocity, forefinger = field, middle finger = induced current."),
  written("physics","Magnetism","9121 · 2023","Why do two parallel conductors exert force on each other?",
    "Each conductor's magnetic field exerts force (F=BIL) on the current in the other."),
  written("physics","Magnetism","9121 · 2023","Maximum value of angle of dip and where does it occur?",
    "90° at magnetic poles."),
  written("physics","Magnetism","9614-A · 2023","Name elements of earth's magnetic field.",
    "Declination, Dip/Inclination, Horizontal component Bₕ."),
  written("physics","Magnetism","9801-B · 2023","What is Cyclotron? Construction, working, limitations. OR Ampere's Circuital Law; solenoid.",
    "Cyclotron accelerates charged particles; fails at relativistic speeds. Ampere's law: ∮B·dl = μ₀I_enc. Solenoid: B = μ₀nI."),
  written("physics","Magnetism","1108 · 2024","What is magnetic dipole? Derive torque on bar magnet. OR Force per unit length between parallel conductors.",
    "τ = MB sinθ. F/L = μ₀I₁I₂/(2πd). One ampere: force 2×10⁻⁷ N/m."),

/* ============================================================
   SUBJECT MAPPING
   ============================================================ */
const SUBJECT_TOPICS = {
  physics: PHYSICS_TOPICS,
  chemistry: CHEMISTRY_TOPICS,
  mathematics: MATH_TOPICS,
};

const ALL_QUESTIONS = [...PHYSICS_QUESTIONS, ...CHEMISTRY_QUESTIONS, ...MATH_QUESTIONS];

/* ============================================================
   STATE & RENDER ENGINE
   ============================================================ */
const state = {
  currentSubject: 'physics',
  activeTopics: new Set(PHYSICS_TOPICS),
  activeTypes: new Set(['mcq','written']),
  answers: {},
  revealed: {},
  reviewed: {}
};

function getQuestions() {
  return ALL_QUESTIONS.filter(q => q.subject === state.currentSubject);
}

function getTopics() {
  return SUBJECT_TOPICS[state.currentSubject] || [];
}

function topicCount(topic) {
  return getQuestions().filter(q => q.topic === topic && state.activeTypes.has(q.qtype)).length;
}

function getVisibleQuestions() {
  return getQuestions().filter(q =>
    state.activeTopics.has(q.topic) && state.activeTypes.has(q.qtype)
  );
}

function updateSubjectCounts() {
  document.getElementById('physCount').textContent = ALL_QUESTIONS.filter(q => q.subject === 'physics').length;
  document.getElementById('chemCount').textContent = ALL_QUESTIONS.filter(q => q.subject === 'chemistry').length;
  document.getElementById('mathCount').textContent = ALL_QUESTIONS.filter(q => q.subject === 'mathematics').length;
  document.getElementById('totalStats').innerHTML =
    `<strong>${ALL_QUESTIONS.length}</strong> total questions · <strong>${state.currentSubject}</strong> · ${getQuestions().length} in this subject`;
}

function renderChips() {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const topics = getTopics();
  topics.forEach(topic => {
    const n = topicCount(topic);
    if (n === 0) return;
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.activeTopics.has(topic) ? ' active' : ' off');
    btn.innerHTML = topic + '<span class="n">' + n + '</span>';
    btn.addEventListener('click', () => {
      if (state.activeTopics.has(topic)) state.activeTopics.delete(topic);
      else state.activeTopics.add(topic);
      renderChips(); renderQuiz(); updateScore();
    });
    chips.appendChild(btn);
  });

  const typeChips = document.getElementById('typeChips');
  typeChips.innerHTML = '';
  const typeDefs = [['mcq','MCQ / TF'], ['written','Written']];
  typeDefs.forEach(([key,label]) => {
    const n = getQuestions().filter(q => q.qtype===key && state.activeTopics.has(q.topic)).length;
    const btn = document.createElement('button');
    btn.className = 'chip type' + (state.activeTypes.has(key) ? ' active' : ' off');
    btn.innerHTML = label + '<span class="n">' + n + '</span>';
    btn.addEventListener('click', () => {
      if (state.activeTypes.has(key)) state.activeTypes.delete(key);
      else state.activeTypes.add(key);
      renderChips(); renderQuiz(); updateScore();
    });
    typeChips.appendChild(btn);
  });
}

function renderQuiz() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';

  const visibleQs = getVisibleQuestions();
  const topicMap = {};
  visibleQs.forEach(q => {
    if (!topicMap[q.topic]) topicMap[q.topic] = [];
    topicMap[q.topic].push(q);
  });

  const topicNames = Object.keys(topicMap);
  if (topicNames.length === 0) {
    quiz.innerHTML = '<div class="empty-state">Nothing to show — pick a topic and question type.</div>';
    return;
  }

  topicNames.forEach(topic => {
    const qs = topicMap[topic];
    const section = document.createElement('section');
    section.className = 'topic-section';

    const head = document.createElement('div');
    head.className = 'topic-head';
    head.innerHTML = '<h2>' + topic + '</h2><span class="count">' + qs.length + ' questions</span>';
    section.appendChild(head);

    qs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const meta = document.createElement('div');
      meta.className = 'q-meta';
      const kindLabel = q.qtype === 'mcq' ? (Object.keys(q.options).length===2 && q.options.A==='True' ? 'TF' : 'MCQ') : 'Written';
      meta.innerHTML = '<span class="q-tag">' + q.src + '</span><span class="q-kind">' + kindLabel + '</span>';
      card.appendChild(meta);

      const text = document.createElement('p');
      text.className = 'q-text';
      text.textContent = q.text;
      card.appendChild(text);

      if (q.qtype === 'mcq') {
        const opts = document.createElement('div');
        opts.className = 'options';
        const picked = state.answers[q.id];
        Object.keys(q.options).forEach(letter => {
          const opt = document.createElement('div');
          let cls = 'opt';
          if (picked) {
            cls += ' disabled';
            if (letter === q.correct) cls += ' correct';
            else if (letter === picked) cls += ' wrong';
          }
          opt.className = cls;
          opt.innerHTML = '<span class="letter">' + letter + '</span><span>' + q.options[letter] + '</span>';
          if (!picked) opt.addEventListener('click', () => selectAnswer(q.id, letter));
          opts.appendChild(opt);
        });
        card.appendChild(opts);

        if (picked) {
          const verdict = document.createElement('div');
          const isRight = picked === q.correct;
          verdict.className = 'verdict ' + (isRight ? 'right' : 'wrong');
          verdict.textContent = isRight ? '✅ Correct.' : '❌ Correct answer is ' + q.correct + '.';
          card.appendChild(verdict);
        }
      } else {
        const btn = document.createElement('button');
        btn.className = 'revealBtn';
        const isShown = !!state.revealed[q.id];
        btn.textContent = isShown ? 'Hide hint' : 'Show hint';
        btn.addEventListener('click', () => toggleReveal(q.id));
        card.appendChild(btn);

        const kp = document.createElement('div');
        kp.className = 'keypoints' + (isShown ? ' shown' : '');
        kp.innerHTML = '<b>Hint: </b>' + q.keypoints;
        card.appendChild(kp);

        const reviewRow = document.createElement('div');
        reviewRow.className = 'reviewRow';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'rev-' + q.id;
        cb.checked = !!state.reviewed[q.id];
        cb.addEventListener('change', () => toggleReviewed(q.id));
        const lbl = document.createElement('label');
        lbl.htmlFor = 'rev-' + q.id;
        lbl.textContent = 'mark as reviewed';
        reviewRow.appendChild(cb);
        reviewRow.appendChild(lbl);
        card.appendChild(reviewRow);
      }

      section.appendChild(card);
    });

    quiz.appendChild(section);
  });
}

function updateScore() {
  const visible = getVisibleQuestions();
  const mcqVisible = visible.filter(q => q.qtype === 'mcq');
  const writtenVisible = visible.filter(q => q.qtype === 'written');

  const answered = mcqVisible.filter(q => state.answers[q.id]);
  const correct = answered.filter(q => state.answers[q.id] === q.correct);
  const reviewed = writtenVisible.filter(q => state.reviewed[q.id]);

  let html = '';
  if (mcqVisible.length) {
    html += '<b>' + answered.length + '</b>/' + mcqVisible.length + ' answered · <span class="correct-n">' + correct.length + '</span> correct';
  }
  if (writtenVisible.length) {
    if (html) html += ' &nbsp;·&nbsp; ';
    html += '<span class="rev-n">' + reviewed.length + '</span>/' + writtenVisible.length + ' reviewed';
  }
  document.getElementById('score').innerHTML = html || 'No questions selected.';
  document.getElementById('totalStats').innerHTML =
    `<strong>${ALL_QUESTIONS.length}</strong> total · <strong>${state.currentSubject}</strong> · ${getQuestions().length} questions`;
}

function selectAnswer(qid, letter) {
  if (state.answers[qid]) return;
  state.answers[qid] = letter;
  renderQuiz(); updateScore();
}

function toggleReveal(qid) {
  state.revealed[qid] = !state.revealed[qid];
  renderQuiz();
}

function toggleReviewed(qid) {
  state.reviewed[qid] = !state.reviewed[qid];
  updateScore();
}

function switchSubject(subject) {
  state.currentSubject = subject;
  state.activeTopics = new Set(SUBJECT_TOPICS[subject] || []);
  state.answers = {};
  state.revealed = {};
  state.reviewed = {};
  document.querySelectorAll('.subject-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.subject === subject);
  });
  renderChips(); renderQuiz(); updateScore();
  document.getElementById('totalStats').innerHTML =
    `<strong>${ALL_QUESTIONS.length}</strong> total · <strong>${subject}</strong> · ${getQuestions().length} questions`;
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
document.querySelectorAll('.subject-tab').forEach(tab => {
  tab.addEventListener('click', () => switchSubject(tab.dataset.subject));
});

document.getElementById('allBtn').addEventListener('click', () => {
  state.activeTopics = new Set(getTopics());
  renderChips(); renderQuiz(); updateScore();
});

document.getElementById('noneBtn').addEventListener('click', () => {
  state.activeTopics = new Set();
  renderChips(); renderQuiz(); updateScore();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.answers = {}; state.revealed = {}; state.reviewed = {};
  renderQuiz(); updateScore();
});

/* ============================================================
   INIT
   ============================================================ */
updateSubjectCounts();
renderChips();
renderQuiz();
updateScore();
</script>
</body>
</html>
